components:
  schemas:
    AIAssistRequest:
      type: object
      properties:
        capability:
          type: string
          default: general
          maxLength: 60
        prompt:
          type: string
      required:
      - prompt
    AIAssistRequestRequest:
      type: object
      properties:
        capability:
          type: string
          minLength: 1
          default: general
          maxLength: 60
        prompt:
          type: string
          minLength: 1
      required:
      - prompt
    AcademicMilestone:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        grade_class:
          type: string
          format: uuid
        class_code:
          type: string
          readOnly: true
        academic_session:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 180
        term:
          type: string
          maxLength: 60
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        target_syllabus_coverage:
          type: integer
          maximum: 32767
          minimum: 0
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        status:
          $ref: '#/components/schemas/MilestoneStatusEnum'
        notes:
          type: string
      required:
      - class_code
      - end_date
      - grade_class
      - id
      - start_date
      - title
    AcademicMilestoneRequest:
      type: object
      properties:
        grade_class:
          type: string
          format: uuid
        academic_session:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 180
        term:
          type: string
          minLength: 1
          maxLength: 60
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        target_syllabus_coverage:
          type: integer
          maximum: 32767
          minimum: 0
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        status:
          $ref: '#/components/schemas/MilestoneStatusEnum'
        notes:
          type: string
      required:
      - end_date
      - grade_class
      - start_date
      - title
    AcademicSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 50
        code:
          type: string
          maxLength: 30
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - end_date
      - id
      - name
      - start_date
    AcademicSessionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        code:
          type: string
          minLength: 1
          maxLength: 30
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
      required:
      - code
      - end_date
      - name
      - start_date
    AccountTypeEnum:
      enum:
      - ASSET
      - LIABILITY
      - INCOME
      - EXPENSE
      - EQUITY
      type: string
      description: |-
        * `ASSET` - Asset
        * `LIABILITY` - Liability
        * `INCOME` - Income
        * `EXPENSE` - Expense
        * `EQUITY` - Equity
    ActionsEnum:
      enum:
      - view
      - create
      - edit
      - delete
      - approve
      - export
      - manage
      type: string
      description: |-
        * `view` - view
        * `create` - create
        * `edit` - edit
        * `delete` - delete
        * `approve` - approve
        * `export` - export
        * `manage` - manage
    AdmissionApplication:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        application_number:
          type: string
          maxLength: 50
        academic_session:
          type: string
          format: uuid
          nullable: true
        applied_class:
          type: string
          format: uuid
          nullable: true
        applied_grade_label:
          type: string
          maxLength: 60
        candidate_name:
          type: string
          maxLength: 150
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          maxLength: 15
        blood_group:
          type: string
          maxLength: 10
        category_quota:
          type: string
          maxLength: 30
        previous_school_name:
          type: string
          maxLength: 200
