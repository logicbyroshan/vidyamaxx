openapi: 3.0.3
info:
  title: VidyaFloww API
  version: 1.0.0
  description: Enterprise School Management Platform REST API
paths:
  /api/v1/audit/events/:
    get:
      operationId: v1_audit_events_list
      description: Read-only paginated Audit Trail strictly scoped to the verified
        School (backs /audit).
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MePreferences'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      description: Update per-membership UI preferences (dashboard KPI order, shortcuts,
        language).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMePreferencesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMePreferencesRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MePreferences'
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: v1_auth_otp_request_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequest'
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: v1_auth_otp_verify_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPVerify'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: v1_auth_password_reset_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordReset'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshToken'
          description: ''
  /api/v1/auth/username/lookup/:
    post:
      operationId: v1_auth_username_lookup_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsernameLookupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UsernameLookupRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameLookup'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: v1_notifications_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/mark-all-read/:
    post:
      operationId: v1_notifications_mark_all_read_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/permissions/policies/:
    get:
      operationId: v1_permissions_policies_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicy'
          description: ''
    patch:
      operationId: v1_permissions_policies_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSecurityPolicyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSecurityPolicyRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicy'
          description: ''
  /api/v1/permissions/responsibilities/:
    get:
      operationId: v1_permissions_responsibilities_list
      description: Manage scoped Staff work responsibilities (30 divisions).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffResponsibility'
          description: ''
    post:
      operationId: v1_permissions_responsibilities_create
      description: Manage scoped Staff work responsibilities (30 divisions).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResponsibilityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateResponsibilityRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponsibility'
          description: ''
  /api/v1/permissions/responsibilities/{id}/:
    delete:
      operationId: v1_permissions_responsibilities_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/permissions/responsibilities/history/:
    get:
      operationId: v1_permissions_responsibilities_history_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsibilityHistory'
          description: ''
  /api/v1/platform/subscription/:
    get:
      operationId: v1_platform_subscription_retrieve
      description: GET active SaaS subscription & billing invoices (backs /license).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/v1/platform/subscription/cancel/:
    post:
      operationId: v1_platform_subscription_cancel_create
      description: Strictly Super Admin only; Super Executive receives 403 Forbidden.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCancelInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubscriptionCancelInputRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/v1/platform/subscription/payment-method/:
    post:
      operationId: v1_platform_subscription_payment_method_create
      description: Allows Super Admin or delegated Super Executive to update payment
        card summary.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodUpdateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentMethodUpdateInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
  /api/v1/schools/branches/:
    get:
      operationId: v1_schools_branches_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
    post:
      operationId: v1_schools_branches_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BranchRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/schools/branches/{id}/:
    patch:
      operationId: v1_schools_branches_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBranchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBranchRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/schools/current/:
    get:
      operationId: v1_schools_current_retrieve
      description: GET/PATCH active school profile & branding (backs /settings).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
          description: ''
    patch:
      operationId: v1_schools_current_partial_update
      description: GET/PATCH active school profile & branding (backs /settings).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSchoolRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSchoolRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
          description: ''
  /api/v1/storage/files/:
    post:
      operationId: v1_storage_files_create
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoredFileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StoredFileRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
          description: ''
  /api/v1/storage/files/{id}/download/:
    get:
      operationId: v1_storage_files_download_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
          description: ''
components:
  schemas:
    ActionsEnum:
      enum:
      - view
      - create
      - edit
      - delete
      - approve
      - export
      - manage
      type: string
      description: |-
        * `view` - view
        * `create` - create
        * `edit` - edit
        * `delete` - delete
        * `approve` - approve
        * `export` - export
        * `manage` - manage
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_user_id:
          type: string
          format: uuid
          nullable: true
        actor_name:
          type: string
          maxLength: 150
        actor_role_label:
          type: string
          maxLength: 80
        category:
          $ref: '#/components/schemas/AuditEventCategoryEnum'
        action:
          type: string
          maxLength: 120
        target_type:
          type: string
          maxLength: 80
        target_id:
          type: string
          maxLength: 120
        ip_address:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AuditEventStatusEnum'
        metadata_json: {}
      required:
      - action
      - created_at
      - id
    AuditEventCategoryEnum:
      enum:
      - Auth
      - Students
      - Exams
      - Finance
      - Settings
      - Gate
      - Permissions
      - Storage
      type: string
      description: |-
        * `Auth` - Auth
        * `Students` - Students
        * `Exams` - Exams
        * `Finance` - Finance
        * `Settings` - Settings
        * `Gate` - Gate
        * `Permissions` - Permissions
        * `Storage` - Storage
    AuditEventStatusEnum:
      enum:
      - Success
      - Warning
      - Blocked
      type: string
      description: |-
        * `Success` - Success
        * `Warning` - Warning
        * `Blocked` - Blocked
    BoardAffiliationEnum:
      enum:
      - CBSE
      - ICSE
      - STATE
      - IB
      - OTHER
      type: string
      description: |-
        * `CBSE` - CBSE
        * `ICSE` - ICSE
        * `STATE` - State Board
        * `IB` - IB / IGCSE
        * `OTHER` - Other
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        school_id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 120
        address:
          type: string
        board:
          type: string
          maxLength: 120
        session_label:
          type: string
          maxLength: 40
        principal_name:
          type: string
          maxLength: 150
        is_primary:
          type: boolean
        status:
          $ref: '#/components/schemas/BranchStatusEnum'
        cover_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        logo_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - school_id
    BranchRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          maxLength: 120
        address:
          type: string
        board:
          type: string
          maxLength: 120
        session_label:
          type: string
          minLength: 1
          maxLength: 40
        principal_name:
          type: string
          maxLength: 150
        is_primary:
          type: boolean
        status:
          $ref: '#/components/schemas/BranchStatusEnum'
        cover_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        logo_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - code
      - name
    BranchStatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
    CreateResponsibilityRequest:
      type: object
      properties:
        membership_id:
          type: string
          format: uuid
        work_division:
          $ref: '#/components/schemas/WorkDivisionEnum'
        submodule_code:
          type: string
          minLength: 1
          default: '*'
          maxLength: 60
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionsEnum'
          minItems: 1
        branch_ids:
          type: array
          items:
            type: string
            format: uuid
        grade_class_ids:
          type: array
          items:
            type: string
            format: uuid
        section_ids:
          type: array
          items:
            type: string
            format: uuid
        subject_ids:
          type: array
          items:
            type: string
            format: uuid
        student_ids:
          type: array
          items:
            type: string
            format: uuid
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          default: ''
      required:
      - actions
      - membership_id
      - work_division
    EventTypeEnum:
      enum:
      - GRANTED
      - UPDATED
      - REVOKED
      type: string
      description: |-
        * `GRANTED` - Granted
        * `UPDATED` - Updated
        * `REVOKED` - Revoked
    Login:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 180
        remember_me:
          type: boolean
          default: true
        device_info:
          type: object
          additionalProperties: {}
      required:
      - identifier
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 180
        password:
          type: string
          writeOnly: true
          minLength: 1
        remember_me:
          type: boolean
          default: true
        device_info:
          type: object
          additionalProperties: {}
      required:
      - identifier
      - password
    MePreferences:
      type: object
      properties:
        preferences:
          type: object
          additionalProperties: {}
      required:
      - preferences
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        is_read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        action_url:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - title
    NotificationRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        notification_type:
          $ref: '#/components/schemas/NotificationTypeEnum'
        is_read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        action_url:
          type: string
          maxLength: 255
      required:
      - title
    NotificationTypeEnum:
      enum:
      - success
      - error
      - warning
      - info
      type: string
      description: |-
        * `success` - Success
        * `error` - Error
        * `warning` - Warning
        * `info` - Info
    OTPRequest:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 180
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
      required:
      - identifier
      - purpose
    OTPRequestRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 180
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
      required:
      - identifier
      - purpose
    OTPVerify:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 180
        otp_code:
          type: string
          maxLength: 6
          minLength: 6
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
      required:
      - identifier
      - otp_code
      - purpose
    OTPVerifyRequest:
      type: object
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 180
        otp_code:
          type: string
          minLength: 6
          maxLength: 6
        purpose:
          $ref: '#/components/schemas/PurposeEnum'
      required:
      - identifier
      - otp_code
      - purpose
    PaginatedAuditEventList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
